name: Swift SDK
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Core tests
        run: swift test
      - name: Build iOS consumer
        run: >-
          xcodebuild -project Examples/BarkyDemo/BarkyDemo.xcodeproj
          -scheme BarkyDemo -destination 'generic/platform=iOS Simulator'
          build CODE_SIGNING_ALLOWED=NO
